name: Email Automation Scheduler

on:
  # Ejecucion periodica; GitHub Actions interpreta cron en UTC.
  schedule:
    - cron: "*/5 * * * *"
  # Permite correrlo manualmente para pruebas/control operativo.
  workflow_dispatch:

concurrency:
  # Evita ejecuciones superpuestas del mismo workflow.
  group: email-automation-scheduler
  cancel-in-progress: false

jobs:
  run-email-automation:
    runs-on: ubuntu-latest
    # Necesario si los secretos se guardaron como "Environment secrets".
    # Si usas otro environment, cambia "production" por el nombre correcto.
    environment: Variables de entorno
    env:
      # Variables minimas requeridas por validacion de entorno.
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: /api/v1
      LOG_LEVEL: info

      # Configuracion de BD (usar Secrets del repositorio).
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGSSLMODE: ${{ secrets.PGSSLMODE }}

      # Configuracion JWT (requerida por carga de env actual).
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      JWT_ACCESS_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12

      # Configuracion SMTP para envio de correos.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

      # URL frontend y zona horaria para reglas de negocio.
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      CRON_TIMEZONE: America/Bogota

      # Parametros del orquestador externo.
      EMAIL_AUTOMATION_WINDOW_MINUTES: 5
      EMAIL_AUTOMATION_ENABLE_PENDING: true
      EMAIL_AUTOMATION_ENABLE_SESSION_REMINDERS: true
      EMAIL_AUTOMATION_ENABLE_WEEKLY_MOTIVATION: true

    steps:
      - name: Workflow metadata
        shell: bash
        run: |
          echo "Workflow revision: email-automation-v2-2026-03-23"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # Forzamos instalar devDependencies porque el script usa ts-node
        # y tipos de TypeScript en tiempo de ejecucion del workflow.
        run: npm ci --include=dev

      - name: Validate required environment variables
        shell: bash
        run: |
          required_vars=(
            PGHOST
            PGPORT
            PGDATABASE
            PGUSER
            PGPASSWORD
            PGSSLMODE
            JWT_SECRET
            JWT_REFRESH_SECRET
            SMTP_HOST
            SMTP_PORT
            SMTP_SECURE
            EMAIL_USER
            EMAIL_PASS
            FRONTEND_URL
          )

          missing_vars=()
          for var_name in "${required_vars[@]}"; do
            value="${!var_name:-}"
            if [ -z "$value" ] || [[ "$value" =~ ^[[:space:]]*$ ]]; then
              missing_vars+=("$var_name")
            fi
          done

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            echo "::error title=Faltan variables de entorno::No se recibieron: ${missing_vars[*]}"
            echo "Configuralas en Settings > Secrets and variables > Actions."
            echo "Si las guardaste como Environment secrets, asigna ese environment al job."
            exit 1
          fi

          if ! [[ "$PGPORT" =~ ^[0-9]+$ ]] || [ "$PGPORT" -le 0 ]; then
            echo "::error title=PGPORT invalido::PGPORT debe ser un entero positivo. Valor recibido: '$PGPORT'"
            exit 1
          fi

          if [ "$PGSSLMODE" != "require" ] && [ "$PGSSLMODE" != "disable" ]; then
            echo "::error title=PGSSLMODE invalido::PGSSLMODE debe ser 'require' o 'disable'. Valor recibido: '$PGSSLMODE'"
            exit 1
          fi

          echo "Variables de entorno requeridas presentes."

      - name: Ensure logs directory exists
        run: mkdir -p logs

      - name: Reset scheduler log files for this run
        shell: bash
        run: |
          : > logs/combined.log
          : > logs/error.log

      - name: Verify SMTP credentials
        run: |
          node -e "const nodemailer=require('nodemailer'); const transporter=nodemailer.createTransport({host:process.env.SMTP_HOST,port:Number(process.env.SMTP_PORT),secure:process.env.SMTP_SECURE==='true',auth:{user:process.env.EMAIL_USER,pass:process.env.EMAIL_PASS},tls:{rejectUnauthorized:false}}); transporter.verify().then(()=>{console.log('SMTP OK')}).catch((error)=>{console.error('SMTP FAIL:', error && error.message ? error.message : error); process.exit(1);});"

      - name: Debug pending notifications (before run)
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require("pg");

          const client = new Client({
            host: process.env.PGHOST,
            port: Number(process.env.PGPORT),
            database: process.env.PGDATABASE,
            user: process.env.PGUSER,
            password: process.env.PGPASSWORD,
            ssl:
              process.env.PGSSLMODE === "require"
                ? { rejectUnauthorized: false }
                : undefined,
          });

          const main = async () => {
            await client.connect();

            const clock = await client.query(
              "SELECT NOW() AS db_now, current_setting('TimeZone') AS db_tz"
            );
            console.log("[db-clock-before]", JSON.stringify(clock.rows[0]));

            const pending = await client.query(`
              SELECT
                id_notificacion,
                id_usuario,
                tipo,
                fecha_programada,
                enviada,
                (fecha_programada <= NOW()) AS due_now
              FROM notificaciones_programadas
              WHERE enviada = false
              ORDER BY fecha_programada ASC
              LIMIT 20
            `);

            console.log("[pending-before] count=" + pending.rowCount);
            for (const row of pending.rows) {
              console.log("[pending-before-row]", JSON.stringify(row));
            }
          };

          main()
            .catch((error) => {
              console.error("DB debug before failed:", error);
              process.exit(1);
            })
            .finally(async () => {
              try {
                await client.end();
              } catch (error) {
                console.error("DB client close failed (before):", error);
              }
            });
          NODE

      - name: Run email automation script
        run: npm run email:automation

      - name: Debug pending notifications (after run)
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require("pg");

          const client = new Client({
            host: process.env.PGHOST,
            port: Number(process.env.PGPORT),
            database: process.env.PGDATABASE,
            user: process.env.PGUSER,
            password: process.env.PGPASSWORD,
            ssl:
              process.env.PGSSLMODE === "require"
                ? { rejectUnauthorized: false }
                : undefined,
          });

          const main = async () => {
            await client.connect();

            const clock = await client.query(
              "SELECT NOW() AS db_now, current_setting('TimeZone') AS db_tz"
            );
            console.log("[db-clock-after]", JSON.stringify(clock.rows[0]));

            const pending = await client.query(`
              SELECT
                id_notificacion,
                id_usuario,
                tipo,
                fecha_programada,
                enviada,
                (fecha_programada <= NOW()) AS due_now
              FROM notificaciones_programadas
              WHERE enviada = false
              ORDER BY fecha_programada ASC
              LIMIT 20
            `);

            console.log("[pending-after] count=" + pending.rowCount);
            for (const row of pending.rows) {
              console.log("[pending-after-row]", JSON.stringify(row));
            }
          };

          main()
            .catch((error) => {
              console.error("DB debug after failed:", error);
              process.exit(1);
            })
            .finally(async () => {
              try {
                await client.end();
              } catch (error) {
                console.error("DB client close failed (after):", error);
              }
            });
          NODE

      - name: Show scheduler logs (post-run)
        if: always()
        shell: bash
        run: |
          echo "=== combined.log ==="
          test -f logs/combined.log && tail -n 200 logs/combined.log || echo "No combined.log"
          echo "=== error.log ==="
          test -f logs/error.log && tail -n 200 logs/error.log || echo "No error.log"
